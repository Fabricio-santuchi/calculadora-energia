name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Gerar tipos das rotas (next typegen)
        # Sem isso, PageProps/LayoutProps (tipos de rota do Next) não
        # existem numa máquina limpa — só aparecem depois de rodar `next
        # dev` ou `next build` pelo menos uma vez.
        run: npx next typegen

      - name: Tipos (tsc)
        run: npx tsc --noEmit

      - name: Testes unitários e de componente (Jest)
        run: npm test

      - name: Build (export estático)
        run: npm run build
